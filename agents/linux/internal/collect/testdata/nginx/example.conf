# managed by hand
server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name example.com;
    ssl_certificate CERTPATH;
    ssl_certificate_key /etc/ssl/private/LEAK_NGINX_KEY_PATH.key;
    location / {
        proxy_set_header Authorization "Bearer LEAK_NGINX_CONFIG";
        proxy_pass http://127.0.0.1:3000;
    }
}
