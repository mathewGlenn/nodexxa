# Nodexxa central services. Secrets come from an env file that is NOT committed:
#   cp deploy/docker/nodexxa.env.example /etc/nodexxa/nodexxa.env  (chmod 600) and fill in values.
#   NODEXXA_ENV_FILE=/etc/nodexxa/nodexxa.env docker compose -f deploy/docker/compose.yml up -d
# Only the dashboard port is published, on loopback, for a TLS-terminating reverse proxy in front.
name: nodexxa

x-app: &app
  image: ${NODEXXA_IMAGE:-nodexxa:local}
  env_file: [ "${NODEXXA_ENV_FILE:-./nodexxa.env}" ]
  init: true
  read_only: true
  tmpfs: [ /tmp ]
  cap_drop: [ ALL ]
  security_opt: [ "no-new-privileges:true" ]
  restart: unless-stopped
  networks: [ internal ]

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    env_file: [ "${NODEXXA_ENV_FILE:-./nodexxa.env}" ]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [ internal ]
    # No published ports: the database is reachable only on the internal network.

  migrate:
    <<: *app
    restart: "no"
    command: [ "apps/dashboard/node_modules/.bin/prisma", "migrate", "deploy", "--schema", "apps/dashboard/prisma/schema.prisma" ]
    depends_on: { db: { condition: service_healthy } }

  dashboard:
    <<: *app
    ports: [ "127.0.0.1:${NODEXXA_PORT:-3000}:3000" ]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy: { resources: { limits: { cpus: "1.0", memory: 768M } } }
    # Published port needs a non-internal network; egress is also used to verify DO tokens on entry.
    networks: [ internal, egress ]

  worker:
    <<: *app
    command: [ "apps/dashboard/node_modules/.bin/tsx", "apps/dashboard/worker/index.ts" ]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
    # Needs outbound HTTPS (DigitalOcean API, uptime targets, SMTP/Telegram); no published ports.
    networks: [ internal, egress ]

networks:
  internal: { internal: true }
  egress: {}

volumes:
  pgdata: {}
