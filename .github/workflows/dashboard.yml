name: dashboard
on:
  push:
    paths: [ "apps/**", "packages/**", "agents/**", "pnpm-lock.yaml", ".github/workflows/dashboard.yml" ]
  pull_request:
    paths: [ "apps/**", "packages/**", "agents/**", "pnpm-lock.yaml", ".github/workflows/dashboard.yml" ]
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Disposable database: the harness creates and drops a fresh DB per run inside it.
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nodexxa, POSTGRES_PASSWORD: nodexxa, POSTGRES_DB: postgres }
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U nodexxa" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_SERVER_URL: postgresql://nodexxa:nodexxa@localhost:5432/postgres
    defaults:
      run: { working-directory: apps/dashboard }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: agents/linux/go.mod }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true # reported, reviewed manually; see docs/engineering/security.md
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: apps/dashboard/test-results, retention-days: 7 }

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile -t nodexxa:ci .
      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id nodexxa:ci -u)" != "0"
